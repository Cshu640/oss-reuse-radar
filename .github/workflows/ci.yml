name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node regression tests
        run: node --test tests/*.mjs
      - name: Install Playwright
        run: pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser mock
        run: python tests/browser_mock_test.py
      - name: Python syntax
        run: python -m py_compile tests/browser_mock_test.py
      - name: JavaScript syntax
        shell: bash
        run: |
          for file in *.js *.mjs tests/*.mjs; do
            node --check "$file"
          done
      - name: JSON checks
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool docs/PROJECT_STATE.json >/dev/null
